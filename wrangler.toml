name = "pto-balance-calculator"
main = "worker/index.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "pto-db"
database_id = "00000000-0000-0000-0000-000000000000"  # `wrangler d1 create pto-db` 결과로 교체
